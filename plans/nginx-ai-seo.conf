# Nginx конфигурация для AI-Friendly SEO
# Добавить в server блок рядом с location = /robots.txt и location = /sitemap.xml
#
# После добавления выполнить:
#   sudo nginx -t          # проверить синтаксис
#   sudo systemctl reload nginx  # применить изменения

# llms.txt — краткая версия для AI-систем
location = /llms.txt {
    proxy_pass http://127.0.0.1:8000/llms.txt;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Кеширование: 24 часа (как в FastAPI)
    proxy_cache_valid 200 24h;
}

# llms-full.txt — полная версия для AI-систем (динамический контент)
location = /llms-full.txt {
    proxy_pass http://127.0.0.1:8000/llms-full.txt;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Кеширование: 1 час (динамический контент из БД)
    proxy_cache_valid 200 1h;
}

# ai.txt — альтернативный стандарт site.ai
location = /ai.txt {
    proxy_pass http://127.0.0.1:8000/ai.txt;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
